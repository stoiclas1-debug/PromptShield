name: PromptShield tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests and validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python modules
        run: python -m py_compile tools/promptshield_runner.py tests/test_promptshield_runner.py

      - name: Validate runner rule listing
        run: python tools/promptshield_runner.py --list-rules --json
cd /home/ubuntu/prompttoken

git status --short --branch --untracked-files=all
git diff -- README.md scripts/fetch-channel-videos.py scripts/test_fetch_channel_videos.py
git diff --cached
